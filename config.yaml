# ---- What to watch ----
# Two ways to define a watch:
#
# 1) Single fixed date/URL (old style, still supported):
#    - name: "..."
#      url: "https://.../buytickets/ET00XXXXXX/20260805?..."
#      cinema_keyword: "Allu"
#
# 2) Auto date-range (recommended - covers dates that open up LATER too):
#    - name: "..."
#      url_template: "https://in.bookmyshow.com/movies/hyderabad/<movie-slug>/buytickets/ET00XXXXXX/{date}"
#      cinema_keyword: "Allu"
#      date_range_days: 10   # checks today + the next 9 days, every run
#
#    {date} gets replaced with YYYYMMDD for each day in the range. Each day
#    gets its own saved state, so a date that's empty today and gets shows
#    added tomorrow will correctly trigger a "new show" email.
#
# IMPORTANT: url_template must NOT include a real date or the ?etCodes=...
# query params tied to one specific date - just the base buytickets URL up
# to /{date}. Grab the exact slug/event-code (ET00...) from any date's real
# URL, then replace only the trailing date segment with {date}.
watches:
  - name: "Spiderman - Allu Cinemas"
    url_template: "https://in.bookmyshow.com/movies/hyderabad/spider-man-brand-new-day/buytickets/ET00502689/{date}"
    cinema_keyword: "Allu"
    date_range_days: 10

# ---- Email ----
# Do NOT put real credentials here - they're pulled from GitHub Secrets
# (GMAIL_ADDRESS, GMAIL_APP_PASSWORD, NOTIFY_TO) at run time. These fields
# only matter if you're running the script locally without those env vars set.
gmail_address: ""
gmail_app_password: ""
notify_to: ""
